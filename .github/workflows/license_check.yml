name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # Exclude license-flagged-but-safe transitive deps:
      #   tqdm        — MPL-2.0 AND MIT, primary license MIT (permissive).
      #   nvidia-*/cuda-*/triton — NVIDIA's redistributable CUDA runtime libs
      #                 pulled by torch; proprietary/no-metadata, not redistributed here.
      #   sentencepiece — Apache-2.0, but its wheel ships no license metadata
      #                 (checker reports "Error").
      exclude_packages: '^(tqdm|nvidia-|cuda-|triton|sentencepiece).*'
      exclude_licenses: '^(Mozilla Public License|MPL).*'
