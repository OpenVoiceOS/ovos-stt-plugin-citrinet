name: Build Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12"]'
      install_extras: "test"
      test_path: "test"
      pre_install_pip: "pytest ovoscope"
