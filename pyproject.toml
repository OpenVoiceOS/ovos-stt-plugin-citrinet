[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-citrinet"
dynamic = ["version"]
description = "A citrinet stt plugin for OpenVoiceOS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
keywords = ["ovos", "plugin", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.8"
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
    "torch>=1.13.1",
    "onnxruntime",
    "sentencepiece",
    "huggingface-hub",
    "numpy<2.0.0",
]

[project.optional-dependencies]
test = [
    "ovoscope>=0.19.0a1",
    "ovos-dinkum-listener",
    "pytest<9",
    "pytest-timeout>=2.0.0",
]

[project.entry-points."opm.stt"]
"ovos-stt-plugin-citrinet" = "ovos_stt_plugin_citrinet:CitrinetSTT"

[tool.setuptools.dynamic]
version = { attr = "ovos_stt_plugin_citrinet.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_citrinet*"]
